name: react app

on:
    push:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: devp/devp
        steps:
            - name: Checkout repo
              uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '18'
            - name: Install dependencies
              run: npm install
            - name: Run tests
              run: npm test